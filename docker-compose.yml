services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rookstone
      POSTGRES_USER: rookstone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - rookstone-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rookstone -d rookstone"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://rookstone:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/rookstone
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3001}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-Rookstone Arena <no-reply@example.invalid>}
      OPERATING_MODE: ${OPERATING_MODE:-free}
      TRUST_PROXY: "0"
      ALLOW_EMBEDDED_DB: "false"
    volumes:
      - rookstone-app-data:/app/data

volumes:
  rookstone-postgres:
  rookstone-app-data:
