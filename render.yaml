# Render.com blueprint - https://render.com/docs/blueprint-spec
# Secrets (ADMIN_PASSWORD, ECOCASH_*, BASE_URL) are marked `sync: false` so you
# set them in the Render dashboard instead of committing them.
services:
  - type: web
    name: betchess-zw
    runtime: node
    plan: starter
    branch: main
    buildCommand: npm ci && node scripts/vendor-assets.mjs
    startCommand: node server.js
    healthCheckPath: /api/config
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0
      - key: PAYMENT_MODE
        value: mock
      - key: ENGINE_VARIANT
        value: sf18-smallnet
      - key: LICHESS_CLOUD_EVAL
        value: "true"
      - key: BASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ECOCASH_MERCHANT_CODE
        sync: false
      - key: ECOCASH_API_KEY
        sync: false
      - key: ECOCASH_WEBHOOK_SECRET
        sync: false
      - key: INNBUCKS_API_KEY
        sync: false
      - key: ONEMONEY_API_KEY
        sync: false
