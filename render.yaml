databases:
  - name: rookstone-db
    databaseName: rookstone
    user: rookstone
    plan: basic_256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: rookstone-arena
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: "22.22.3"
      - key: DATABASE_URL
        fromDatabase:
          name: rookstone-db
          property: connectionString
      - key: SESSION_SECRET
        sync: false
      - key: PUBLIC_ORIGIN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: EMAIL_PROVIDER
        value: gmail
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_URL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      - key: OPERATING_MODE
        value: free
      - key: CASH_AGENTS_ENABLED
        value: "false"
      - key: TRUST_PROXY
        value: "1"
      - key: ALLOW_EMBEDDED_DB
        value: "false"
